[package]
name = "liquid-deck"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "Ultra-lightweight Stream Deck & live hardware dashboard with a Liquid Glass web UI"
license = "MIT"
repository = "https://github.com/your-org/liquid-deck"
readme = "README.md"
keywords = ["stream-deck", "dashboard", "sysinfo", "websocket", "glassmorphism"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "liquid-deck"
path = "src/main.rs"

[dependencies]
# HTTP + WebSocket. No TLS stack: run behind a reverse proxy for HTTPS.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
# Single-threaded runtime keeps the idle footprint tiny.
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "process", "macros", "io-util", "signal"] }
# Only the subsystems we actually use.
sysinfo = { version = "0.39", default-features = false, features = ["system", "network", "component"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = { version = "8", default-features = false }

[profile.release]
opt-level = "z"     # optimise for size
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
