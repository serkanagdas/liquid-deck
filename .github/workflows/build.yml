name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  build:
    name: build · ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x86_64

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build release
        env:
          RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1 | tr -d '\r')"
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              cp "target/${{ matrix.target }}/release/liquid-deck" "dist/liquid-deck-$VERSION-linux-x86_64"
              ;;
            x86_64-pc-windows-msvc)
              cp "target/${{ matrix.target }}/release/liquid-deck.exe" "dist/liquid-deck-$VERSION-windows-x86_64.exe"
              ;;
            aarch64-apple-darwin)
              cp "target/${{ matrix.target }}/release/liquid-deck" "dist/liquid-deck-$VERSION-macos-arm64"
              ;;
            x86_64-apple-darwin)
              cp "target/${{ matrix.target }}/release/liquid-deck" "dist/liquid-deck-$VERSION-macos-x86_64"
              ;;
          esac
          ls -lh dist

      - name: Package AppImage
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          APPDIR="$PWD/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/metainfo"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          cp "target/${{ matrix.target }}/release/liquid-deck" "$APPDIR/usr/bin/liquid-deck"
          chmod +x "$APPDIR/usr/bin/liquid-deck"
          cp web/icon-512.png "$APPDIR/liquid-deck.png"
          cp web/icon-512.png "$APPDIR/.DirIcon"
          cp web/icon-512.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/liquid-deck.png"

          # The desktop entry and AppStream data must start at column 0: YAML
          # strips the block indentation before bash sees the heredoc.
          cat > "$APPDIR/liquid-deck.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Liquid Deck
          Comment=Stream Deck and live hardware dashboard
          Exec=liquid-deck
          Icon=liquid-deck
          Terminal=false
          Categories=Utility;
          Keywords=dashboard;metrics;streamdeck;macro;
          EOF
          cp "$APPDIR/liquid-deck.desktop" "$APPDIR/usr/share/applications/liquid-deck.desktop"

          cat > "$APPDIR/usr/share/metainfo/io.github.serkanagdas.LiquidDeck.appdata.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>io.github.serkanagdas.LiquidDeck</id>
            <name>Liquid Deck</name>
            <summary>Stream Deck and live hardware dashboard</summary>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>MIT</project_license>
            <description>
              <p>Liquid Deck serves a local dashboard with system metrics, a media player and a configurable macro deck.</p>
            </description>
            <developer id="io.github.serkanagdas">
              <name>Serkan Ağdaş</name>
            </developer>
            <launchable type="desktop-id">liquid-deck.desktop</launchable>
            <url type="homepage">https://github.com/serkanagdas/liquid-deck</url>
            <provides>
              <binary>liquid-deck</binary>
            </provides>
            <releases>
              <release version="1.0.1" date="2026-11-12"/>
            </releases>
            <content_rating type="oars-1.1"/>
          </component>
          EOF

          # appimagetool refuses an AppDir without an executable AppRun.
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/liquid-deck" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1 | tr -d '\r')"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" "dist/liquid-deck-$VERSION-x86_64.AppImage"
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          compression-level: 9

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
