name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  build:
    name: build · ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x86_64

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              cp "target/${{ matrix.target }}/release/liquid-deck" dist/liquid-deck-linux-x86_64
              ;;
            x86_64-pc-windows-msvc)
              cp "target/${{ matrix.target }}/release/liquid-deck.exe" dist/liquid-deck-windows-x86_64.exe
              ;;
            aarch64-apple-darwin)
              cp "target/${{ matrix.target }}/release/liquid-deck" dist/liquid-deck-macos-arm64
              ;;
            x86_64-apple-darwin)
              cp "target/${{ matrix.target }}/release/liquid-deck" dist/liquid-deck-macos-x86_64
              ;;
          esac
          ls -lh dist

      - name: Package AppImage
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          APPDIR="$PWD/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          cp "target/${{ matrix.target }}/release/liquid-deck" "$APPDIR/usr/bin/liquid-deck"
          cp web/icon-512.png "$APPDIR/liquid-deck.png"
          cp web/icon-512.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/liquid-deck.png"

          cat > "$APPDIR/liquid-deck.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Liquid Deck
          Comment=Stream Deck and live hardware dashboard
          Exec=liquid-deck
          Icon=liquid-deck
          Terminal=true
          Categories=Utility;System;
          Keywords=dashboard;metrics;streamdeck;macro;
          EOF
          cp "$APPDIR/liquid-deck.desktop" "$APPDIR/usr/share/applications/liquid-deck.desktop"

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" dist/LiquidDeck-x86_64.AppImage
          ls -lh dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          compression-level: 9

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
